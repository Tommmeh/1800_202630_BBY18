<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Information | PhshPsh</title>
    <link rel="icon" type="image/png" href="./images/phshing-logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="phsh-navbar">
        <div class="navbar-container">

            <!-- Centered logo -->
            <a href="index.html" class="navbar-logo">
                <img src="./images/School_of_Phish_Logo.png" alt="Phshing logo">
            </a>

            <!-- Navigation links -->
            <ul class="navbar-links">
                <li><a href="homepage.html">Home</a></li>
                <li><a href="gameslist.html">Games</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>

        </div>
    </nav>

    <main class="container my-5">
        <h1>Account Information</h1>
        <p>View and manage your account information.</p>

        <div class="card p-4 mt-4">

            <div class="text-center mb-4">
                <div id="avatar"
                    class="rounded-circle bg-primary text-white d-inline-flex justify-content-center align-items-center"
                    style="width: 80px; height: 80px; font-size: 30px;">
                    ?
                </div>

                <h3 id="profileName" class="mt-3">Loading...</h3>
                <p id="profileEmail"></p>
            </div>

            <form id="profileForm">

                <div class="mb-3">
                    <label for="nameInput" class="form-label">Name</label>
                    <input type="text" id="nameInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="countryInput" class="form-label">Country</label>
                    <input type="text" id="countryInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="schoolInput" class="form-label">School</label>
                    <input type="text" id="schoolInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="bioInput" class="form-label">Bio</label>
                    <textarea id="bioInput" class="form-control" rows="3" disabled></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" id="editBtn" class="btn btn-primary">
                        Edit Profile
                    </button>

                    <button type="submit" id="saveBtn" class="btn btn-success" disabled>
                        Save Changes
                    </button>
                </div>

                <div id="profileAlert" class="alert alert-success d-none mt-3"></div>

            </form>
        </div>
        <div class="card p-4 mt-4">
            <h2>My Favourite Games</h2>
            <div id="favourite-games-go-here"></div>
        </div>
        <template id="favouriteGameCardTemplate">
            <div class="col">
                <div class="card shadow-sm h-100">
                    <img class="card-img-top game-image" src="" alt="Game Thumbnail" height="225"
                        style="object-fit: cover;">

                    <div class="card-body">
                        <h5 class="card-title"></h5>
                        <p class="card-text"></p>
                        <a href="#" class="game_button btn btn-primary btn-sm"></a>
                        <small class="text-muted"></small>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <site-footer></site-footer>

    <script type="module" src="./src/profile.js"></script>
    <script src="./src/accessibility.js"></script>
</body>

</html>
