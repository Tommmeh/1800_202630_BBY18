
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | PhshPsh</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <div class="px-3 py-2 fg-white bg-black border-bottom" data-bs-theme="dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center lg:justify-content-start"><a href="/"
                    class="d-flex align-items-center my-2 lg:my-0 lg:me-auto fg-body text-decoration-none"><svg
                        class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                        <use href="#bootstrap"></use>
                    </svg></a>
                <ul class="nav col-12 lg:col-auto my-2 justify-content-center md:my-0">
                    <li><a href="homepage.html" class="nav-link fg-secondary flex-column"><svg
                                class="bi d-block mx-auto" width="24" height="24" aria-hidden="true">
                                <use href="homepage.html"></use>
                            </svg>Home</a></li>
                    <li><a href="./gameslist.html" class="nav-link fg-white flex-column">
                            <svg class="bi d-block mx-auto" width="24" height="24" aria-hidden="true">
                                <use href="#speedometer2"></use>
                            </svg>
                            Games
                        </a></li>
                    <li><a href="learninglist.html" class="nav-link fg-white flex-column"><svg
                                class="bi d-block mx-auto" width="24" height="24" aria-hidden="true">
                                <use href="#table"></use>
                            </svg>Learn</a></li>
                    <li><a href="#" class="nav-link fg-white flex-column"><svg class="bi d-block mx-auto" width="24"
                                height="24" aria-hidden="true">
                                <use href="#grid"></use>
                            </svg>Settings</a></li>
                    <li><a href="profile.html" class="nav-link fg-white flex-column"><svg class="bi d-block mx-auto"
                                width="24" height="24" aria-hidden="true">
                                <use href="index.html"></use>
                            </svg>Profile</a></li>
                </ul>
            </div>
        </div>
    </div>

    <main class="container my-5">
        <h1>My Profile</h1>
        <p>View and manage your account information.</p>

        <div class="card p-4 mt-4">

            <div class="text-center mb-4">
                <div id="avatar" class="rounded-circle bg-primary text-white d-inline-flex justify-content-center align-items-center" style="width: 80px; height: 80px; font-size: 30px;">
                    ?
                </div>

                <h3 id="profileName" class="mt-3">Loading...</h3>
                <p id="profileEmail"></p>
            </div>

            <form id="profileForm">

                <div class="mb-3">
                    <label for="nameInput" class="form-label">Name</label>
                    <input type="text" id="nameInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="countryInput" class="form-label">Country</label>
                    <input type="text" id="countryInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="schoolInput" class="form-label">School</label>
                    <input type="text" id="schoolInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="bioInput" class="form-label">Bio</label>
                    <textarea id="bioInput" class="form-control" rows="3" disabled></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" id="editBtn" class="btn btn-primary">
                        Edit Profile
                    </button>

                    <button type="submit" id="saveBtn" class="btn btn-success" disabled>
                        Save Changes
                    </button>
                </div>

                <div id="profileAlert" class="alert alert-success d-none mt-3"></div>

            </form>
        </div>
    </main>

    <site-footer></site-footer>

    <script type="module" src="./src/profile.js"></script>
</body>
</html>
