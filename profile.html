
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | PhshPsh</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <site-navbar></site-navbar>

    <main class="container my-5">
        <h1>My Profile</h1>
        <p>View and manage your account information.</p>

        <div class="card p-4 mt-4">

            <div class="text-center mb-4">
                <div id="avatar" class="rounded-circle bg-primary text-white d-inline-flex justify-content-center align-items-center" style="width: 80px; height: 80px; font-size: 30px;">
                    ?
                </div>

                <h3 id="profileName" class="mt-3">Loading...</h3>
                <p id="profileEmail"></p>
            </div>

            <form id="profileForm">

                <div class="mb-3">
                    <label for="nameInput" class="form-label">Name</label>
                    <input type="text" id="nameInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="countryInput" class="form-label">Country</label>
                    <input type="text" id="countryInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="schoolInput" class="form-label">School</label>
                    <input type="text" id="schoolInput" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="bioInput" class="form-label">Bio</label>
                    <textarea id="bioInput" class="form-control" rows="3" disabled></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" id="editBtn" class="btn btn-primary">
                        Edit Profile
                    </button>

                    <button type="submit" id="saveBtn" class="btn btn-success" disabled>
                        Save Changes
                    </button>
                </div>

                <div id="profileAlert" class="alert alert-success d-none mt-3"></div>

            </form>
        </div>
    </main>

    <site-footer></site-footer>

    <script type="module" src="./src/profile.js"></script>
</body>
</html>
