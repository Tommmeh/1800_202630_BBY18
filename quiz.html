<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phishing Quiz | Phsh Game</title>

    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Phsh Game</h1>
            <a href="gameslist.html" class="btn btn-outline-light btn-sm">
                Back to Games
            </a>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-2">Phishing Quiz</h2>
                        <p class="text-center text-muted">
                            Test your knowledge of online safety!
                        </p>

                        <hr>

                        <p id="question-number" class="text-muted">
                            Question 1 of 3
                        </p>

                        <h3 id="question" class="h5 mb-4">
                            You receive an email asking you to verify your account
                            through an unfamiliar link. What should you do?
                        </h3>

                        <div id="answer-options">
                            <div class="form-check border rounded p-3 mb-2">
                                <input class="form-check-input ms-0 me-2"
                                    type="radio" name="answer" id="answer-a"
                                    value="a">
                                <label class="form-check-label" for="answer-a">
                                    Click the link immediately
                                </label>
                            </div>

                            <div class="form-check border rounded p-3 mb-2">
                                <input class="form-check-input ms-0 me-2"
                                    type="radio" name="answer" id="answer-b"
                                    value="b">
                                <label class="form-check-label" for="answer-b">
                                    Verify the email through the official website
                                </label>
                            </div>

                            <div class="form-check border rounded p-3 mb-2">
                                <input class="form-check-input ms-0 me-2"
                                    type="radio" name="answer" id="answer-c"
                                    value="c">
                                <label class="form-check-label" for="answer-c">
                                    Reply with your password
                                </label>
                            </div>
                        </div>

                        <p id="feedback" class="mt-3" aria-live="polite"></p>

                        <div class="d-flex justify-content-between mt-4">
                            <button id="submit-button" class="btn btn-primary">
                                Submit Answer
                            </button>

                            <button id="next-button"
                                class="btn btn-secondary" hidden>
                                Next Question
                            </button>
                        </div>

                    </div>
                </div>

                <p id="final-score" class="text-center mt-4 fw-bold"
                    aria-live="polite"></p>

            </div>
        </div>
    </main>
    <script type="module" src="/src/quiz.js"></script>
</body>
</html>
