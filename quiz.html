<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phishing Quiz | Phsh Game</title>

    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Phsh Game</h1>
            <a href="gameslist.html" class="btn btn-outline-light btn-sm">
                Back to Games
            </a>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-2">Phishing Quiz</h2>
                        <p class="text-center text-muted">
                            Test your knowledge of online safety!
                        </p>

                        <hr>

                        <p id="question-number" class="text-muted">
                            Question 1 of 3
                        </p>

                        <h3 id="question" class="h5 mb-4">
                            You receive an email asking you to verify your account
                            through an unfamiliar link. What should you do?
                        </h3>

                        <div id="answer-options">
                            <div class="form-check border rounded p-3 mb-2">
                                <input class="form-check-input ms-0 me-2"
                                    type="radio" name="answer" id="answer-a"
                                    value="a">
                                <label class="form-check-label" for="answer-a">
                                    Click the link immediately
                                </label>
                            </div>

                            <div class="form-check border rounded p-3 mb-2">
                                <input class="form-check-input ms-0 me-2"
                                    type="radio" name="answer" id="answer-b"
                                    value="b">
                                <label class="form-check-label" for="answer-b">
                                    Verify the email through the official website
                                </label>
                            </div>

                            <div class="form-check border rounded p-3 mb-2">
                                <input class="form-check-input ms-0 me-2"
                                    type="radio" name="answer" id="answer-c"
                                    value="c">
                                <label class="form-check-label" for="answer-c">
                                    Reply with your password
                                </label>
                            </div>
                        </div>

                        <p id="feedback" class="mt-3" aria-live="polite"></p>

                        <div class="d-flex justify-content-between mt-4">
                            <button id="submit-button" class="btn btn-primary">
                                Submit Answer
                            </button>

                            <button id="next-button"
                                class="btn btn-secondary" hidden>
                                Next Question
                            </button>
                        </div>

                    </div>
                </div>

                <p id="final-score" class="text-center mt-4 fw-bold"
                    aria-live="polite"></p>

            </div>
        </div>
    </main>

    <script>
        const questions = [
            {
                question: "You receive an email asking you to verify your account through an unfamiliar link. What should you do?",
                answers: [
                    "Click the link immediately",
                    "Verify the email through the official website",
                    "Reply with your password"
                ],
                correct: 1,
                explanation: "Good choice! Visit the official website directly instead of trusting an unfamiliar link."
            },
            {
                question: "Which can be a warning sign of a phishing email?",
                answers: [
                    "A suspicious link and urgent request for information",
                    "A message you were expecting from a known contact",
                    "An email with information you already verified"
                ],
                correct: 0,
                explanation: "Suspicious links and pressure to act quickly can be signs of phishing."
            },
            {
                question: "What should you do if you suspect a message is phishing?",
                answers: [
                    "Open every attachment to check it",
                    "Forward it to all your friends",
                    "Avoid its links and report it through the appropriate channel"
                ],
                correct: 2,
                explanation: "Avoid interacting with suspicious messages and report them through an appropriate channel."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionNumber = document.getElementById("question-number");
        const questionText = document.getElementById("question");
        const answerOptions = document.getElementById("answer-options");
        const feedback = document.getElementById("feedback");
        const submitButton = document.getElementById("submit-button");
        const nextButton = document.getElementById("next-button");
        const finalScore = document.getElementById("final-score");

        function displayQuestion() {
            const item = questions[currentQuestion];

            questionNumber.textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;
            questionText.textContent = item.question;
            feedback.textContent = "";
            finalScore.textContent = "";
            answered = false;

            answerOptions.innerHTML = "";

            item.answers.forEach((answer, index) => {
                const wrapper = document.createElement("div");
                wrapper.className = "form-check border rounded p-3 mb-2";

                const input = document.createElement("input");
                input.className = "form-check-input ms-0 me-2";
                input.type = "radio";
                input.name = "answer";
                input.id = `answer-${index}`;
                input.value = index;

                const label = document.createElement("label");
                label.className = "form-check-label";
                label.htmlFor = input.id;
                label.textContent = answer;

                wrapper.append(input, label);
                answerOptions.appendChild(wrapper);
            });

            submitButton.hidden = false;
            submitButton.disabled = false;
            nextButton.hidden = true;
            nextButton.textContent =
                currentQuestion === questions.length - 1
                    ? "See Results"
                    : "Next Question";
        }

        submitButton.addEventListener("click", function () {
            if (answered) return;

            const selected = document.querySelector(
                'input[name="answer"]:checked'
            );

            if (!selected) {
                feedback.textContent = "Please select an answer first.";
                feedback.className = "mt-3 text-danger";
                return;
            }

            answered = true;
            const item = questions[currentQuestion];
            const isCorrect = Number(selected.value) === item.correct;

            if (isCorrect) {
                score++;
                feedback.textContent = "Correct! " + item.explanation;
                feedback.className = "mt-3 text-success";
            } else {
                feedback.textContent = "Not quite. " + item.explanation;
                feedback.className = "mt-3 text-danger";
            }

            submitButton.hidden = true;
            nextButton.hidden = false;
        });

        nextButton.addEventListener("click", function () {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                displayQuestion();
            } else {
                questionNumber.textContent = "Quiz complete!";
                questionText.textContent = "You've finished the Phishing Quiz.";
                answerOptions.innerHTML = "";
                feedback.textContent = "";
                submitButton.hidden = true;
                nextButton.hidden = true;
                finalScore.textContent =
                    `Your score: ${score} out of ${questions.length}`;
            }
        });

        displayQuestion();
    </script>

</body>
</html>
