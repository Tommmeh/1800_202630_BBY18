<head>
    <title>Phsh Game</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/style.css">

<body>

    <!------------------------------>

    <div id="disable_interaction">

        <nav class="phsh-navbar">
            <div class="navbar-container">

                <!-- Centered logo -->
                <a href="index.html" class="navbar-logo">
                    <img src="./images/School_of_Phish_Logo.png" alt="Phshing logo">
                </a>

                <!-- Navigation links -->
                <ul class="navbar-links">
                    <li><a href="homepage.html">Home</a></li>
                    <li><a href="gameslist.html">Games</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>

            </div>
        </nav>

        <section class="pt-5 text-center container">
            <div class="row lg:py-5">
                <div class="lg:col-6 md:col-8 mx-auto">
                    <h1 class="fw-bold" id="welcome-heading">Hello!</h1>

                    <h2 class="fw-bold">
                        Your Phsh adventure starts here! 🐠
                    </h2>

                    <p class="fs-5">
                        Finish your daily quests and keep your little Phsh happy,
                        healthy and <b>ALIVE!💀</b>
                    </p>
                </div>
            </div>
        </section>

        <div class="fish-age-card">
            <h3>🐠 Your Phsh Age</h3>
            <h2 id="FishAge">Loading...</h2>
            <p>Your little buddy's age</p>
        </div>

        <div class="tank">
            <div id="fish"></div>
        </div>

        <div class="container">
            <div id="HungerBackground">
                <div id="BarLabel">
                    <b>Hunger Bar:</b>
                </div>
                <div id="BarFrame">
                    <div id="HungerBar"></div>
                </div>
            </div>
        </div>


        <!--- Quest section --->


        <div class="album py-3 bg-1">
            <div class="container">

                <div class="container-fluid bg-body text-dark p-5">
                    <h1>Quests</h1>
                    <h4 id="questTimer">Time remaining: Loading...</h4>
                    <div id="quests-go-here" class="row">
                    </div>
                </div>

                <template id="questCardTemplate">
                    <div class="row row-cols-1 sm:row-cols-2 md:row-cols-3 g-3">
                        <div class="col">
                            <div class="card" style="width: 100%;">
                                <h4 class="p-3 card-header">header</h4>
                                <div class="card-body">
                                    <p class="card-text"></p>
                                    <p class="card-length"></p>
                                    <div style="display: flex; justify-content: space-between; align-items: center">
                                        <a href="" class="btn btn-warning"> Go to game</a>
                                        <b class="status text-danger">Checking...</b>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!---End of quest section-->
                </main>

                <div class="container">
                    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
                        <div class="md:col-4 d-flex align-items-center"><a href="/"
                                class="mb-3 me-2 md:mb-0 fg-2 text-decoration-none lh-1" aria-label="Bootstrap"><svg
                                    class="bi" width="30" height="24" aria-hidden="true">
                                    <use href="#bootstrap"></use>
                                </svg></a><span class="mb-3 md:mb-0 fg-2">© 2026 Company, Inc</span></div>
                        <ul class="nav md:col-4 justify-content-end list-unstyled d-flex">
                            <li class="ms-3"><a class="fg-2" href="#" aria-label="Instagram"><svg class="bi" width="24"
                                        height="24" aria-hidden="true">
                                        <use href="#instagram"></use>
                                    </svg></a></li>
                            <li class="ms-3"><a class="fg-2" href="#" aria-label="Facebook"><svg class="bi" width="24"
                                        height="24">
                                        <use href="#facebook"></use>
                                    </svg></a></li>
                        </ul>
                    </footer>
                </div>
            </div>

            <!---------------------------------------------->
            <!-- Your own JavaScript functions go here    -->
            <!---------------------------------------------->

            <!-- Link to scripts of your own -->
            <script type="module" src="./src/main.js"></script>
            <script type="module" src="./src/quests.js"></script>
            <script src="./src/accessibility.js"></script>

</body>

</html>
